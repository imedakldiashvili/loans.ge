<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap"><style>body{margin:0;padding:16px;background:var(--bg);color:var(--fg-body);font-family:var(--font-sans);font-size:14px;line-height:1.6}*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style><style>.cd{display:inline-flex;align-items:center;height:28px;padding:0 9px;border:1px solid var(--orange);border-radius:var(--radius-pill);background:var(--orange-soft);color:var(--orange);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}.cd.over{color:var(--red);border-color:var(--red);background:var(--red-soft)}</style>
<div class="row" style="gap:16px"><span class="cd" id="a">56:54</span><span class="cd" id="b">04:54</span><span class="cd over">00:00</span></div>
<script>let a=56*60+54,b=4*60+54;const f=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');setInterval(()=>{a=Math.max(0,a-1);b=Math.max(0,b-1);document.getElementById('a').textContent=f(a);document.getElementById('b').textContent=f(b);},1000);</script>
