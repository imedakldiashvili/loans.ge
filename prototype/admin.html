<style>

  /* ცხრილის ქვედა ზოლი: დიაპაზონი მარცხნივ, გვერდები მარჯვნივ — ყველა სიაზე ერთნაირი */
  .pfoot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg-soft); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pager { display: flex; gap: 4px; align-items: center; }
  .pg { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 600; cursor: pointer; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .pg.on { background: var(--green); border-color: var(--green); color: var(--on-accent); } .pg:disabled { opacity: .4; cursor: default; } .pg:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .pg-dots { padding: 0 4px; color: var(--muted); }
  .pfoot .pp { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-inline-end: 6px; } .pfoot .ppsel { width: auto; padding: 5px 36px 5px 10px; font-size: 13px; height: 32px; background-position: right 12px center; }
  .pfoot .pright { display: inline-flex; align-items: center; gap: 12px; } .pfoot .pcount { font-size: 12px; color: var(--muted); white-space: nowrap; }
  /* ცხრილის თავში დამატების ფორმა (ცნობარები) */
  .addrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-inline-start: auto; } .addrow input, .addrow select { width: auto; min-width: 120px; padding: 7px 10px; font-size: 13px; } .addrow .narrow { min-width: 80px; width: 90px; }
  td.ord, th.ord { width: 56px; color: var(--muted); font-variant-numeric: tabular-nums; }
  table.wide { min-width: 1180px; }   /* ბევრსვეტიანი ცხრილი: ვიწროზე ჰორიზონტალური სქროლი, სვეტები არ იჭყლიტება */
  th.acts { width: 96px; } th.ast-c, td.ast-c { width: 64px; text-align: center; vertical-align: middle; padding-inline: 8px; } td.ast-c .ast { display: grid; place-items: center; margin: 0 auto; } td.ast-c .ast svg { width: 36px; height: 36px; display: block; } .loan-n { display: block; } td .oe-who b { font-size: 14px; } td.big .sub { font-size: 12px; font-weight: 400; } .cust-n { display: block; font-size: 16px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cust-n .pid { margin-inline-end: 8px; } .ast { display: inline-grid; place-items: center; flex: none; } .ast svg { width: 20px; height: 20px; } .ast.active { color: var(--orange); } .ast.done { color: var(--green); } .view-sub .ast { vertical-align: -4px; margin-inline-end: 4px; } .view-sub .ast svg { width: 18px; height: 18px; }
  dialog.view { width: min(560px, calc(100vw - 32px)); } .view-sub { margin: -4px 0 16px; font-size: 13px; color: var(--muted); } .view-body { display: grid; gap: 14px; }
  .view-sec { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; } .view-sec h4 { margin: 0; padding: 9px 14px; background: var(--bg-soft); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .view-row { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 8px 14px; font-size: 13px; border-top: 1px solid var(--line); } .view-sec h4 + .view-row { border-top: 0; } .view-row span { color: var(--muted); } .view-row b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
  .view-row .st { background: none !important; padding: 0; border-radius: 0; font-size: 13px; white-space: normal; color: var(--grey-status); } .view-row .st.sent { color: var(--orange); } .view-row .st.interested { color: var(--amber); } .view-row .st.offer { color: var(--sky); } .view-row .st.accepted { color: var(--blue); } .view-row .st.done { color: var(--green); } .scs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } td.org-c .scs { justify-content: flex-end; } .otot { display: inline-grid; place-items: center; min-width: 28px; height: 26px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; font-weight: 700; font-size: 14px; color: var(--fg); font-variant-numeric: tabular-nums; } .scs .sc { min-width: 20px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 4px; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; } th.acts.a3 { width: 136px; } th.w1 { width: 64px; } th.w2 { width: 80px; } th.w3 { width: 110px; } th.w4 { width: 130px; } th.w5 { width: 150px; } th.w6 { width: 170px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; z-index: 30; box-shadow: 0 8px 20px rgba(0,0,0,.2); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 900px) {
    .app.in { grid-template-columns: 1fr; height: auto; } .app.in .col { height: auto; } .app.in .col > main.wrap { display: block; } .app.in .main { overflow: visible; display: grid; } .app.in .main > .panel > .tbl { overflow-x: auto; overflow-y: visible; }
    .sb { position: static; height: auto; padding: 10px 12px; gap: 10px; border-inline-end: 0; border-bottom: 1px solid var(--line); } #sbTg { display: none; } .sb-logo { height: auto; margin: 0; padding: 0 8px 8px; }
    .side { display: flex; flex-wrap: wrap; gap: 4px; } .side .grp, .side hr, .side button.par { display: none; } .side button { width: auto; flex: none; padding: 8px 10px; font-size: 13px; } .side button.on::before { display: none; } .side .sub, .side .sub[hidden] { display: contents !important; }
    .srow { grid-template-columns: 1fr; gap: 4px; padding-block: 10px; } .srow.hd { display: none; }
  }
  @media (max-width: 520px) { .addrow { width: 100%; } .addrow input, .addrow select { flex: 1 1 100px; } .search { width: 100%; } .who > span:last-child, .logo b { display: none; } .panel h3 select, .panel h3 .search { width: 100% !important; margin-inline-start: 0 !important; } .top select { width: 100%; } .dlg-h, .dlg-b, .dlg-f { padding-inline: 18px; } .frow { grid-template-columns: 28px 1fr; } .frow .kind { grid-column: 2; justify-self: start; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  const calcOffer = t => { const amt = +t.amount || 0, n = +t.months || 0, r = (+t.rate || 0) / 1200, fee = +t.fee || 0, ins = +t.insMonth || 0; if (!amt || !n) return null; const pay = r ? amt * r / (1 - Math.pow(1 + r, -n)) : amt / n; const m = pay + ins, cash = amt - fee; let lo = 0, hi = 1; for (let k = 0; k < 60; k++) { const mid = (lo + hi) / 2; const pv = m * (1 - Math.pow(1 + mid, -n)) / mid; if (pv > cash) lo = mid; else hi = mid; } return { monthly: Math.round(m), eff: Math.round((Math.pow(1 + (lo + hi) / 2, 12) - 1) * 1000) / 10, total: Math.round(m * n + fee), interest: Math.round(pay * n - amt), insTotal: Math.round(ins * n) }; };

      <div class="f"><label for="sName">სახელი, გვარი</label><input type="text" id="sName" value="${esc(s.name)}" required></div>
      <div class="fgrid" style="padding:0"><div class="f"><label for="sEmail">ელ.ფოსტა</label><input type="email" id="sEmail" value="${esc(s.email)}" required></div><div class="f"><label for="sPhone">მობილური</label><input type="tel" id="sPhone" value="${esc(s.phone)}" placeholder="+995 5.. .. .. .."></div></div>
      <div id="sScope"><div class="f"><label>პროდუქტები <small style="display:inline">(არცერთი = ყველა)</small></label><div class="checks">${partnerProds.map(([id, n]) => `<label><input type="checkbox" name="sProd" value="${id}" ${(s.products || []).includes(id) ? 'checked' : ''}>${esc(n)} <code>${id}</code></label>`).join('')}</div></div>
      <div class="f" style="margin-top:14px"><label>ლოკაცია <small style="display:inline">(არცერთი = ყველა)</small></label><div class="checks">${cities().map(c => `<label><input type="checkbox" name="sCity" value="${esc(c)}" ${(s.cities || []).includes(c) ? 'checked' : ''}>${esc(c)}</label>`).join('')}</div></div></div>`, () => {
      const name = $('sName').value.trim(), email = $('sEmail').value.trim(), role = $('sRole').value; if (!name) { $('sName').focus(); return false; } if (!email) { $('sEmail').focus(); return false; }
      const target = isNew ? $('sOrg').value : org; const rec = { ...s, name, email, phone: $('sPhone').value.trim(), role, active: s.active !== false, products: role === 'sales' ? [...document.querySelectorAll('input[name=sProd]:checked')].map(x => x.value) : null, cities: role === 'sales' ? [...document.querySelectorAll('input[name=sCity]:checked')].map(x => x.value) : null };
      if (rec.products && !rec.products.length) rec.products = null; if (rec.cities && !rec.cities.length) rec.cities = null;
      saveStaff(target, isNew ? [...staffFor(target), rec] : staffFor(target).map(x => x.id === s.id ? rec : x)); toast('შენახულია'); render();
    });
    const syncRole = () => { $('sScope').hidden = $('sRole').value !== 'sales'; }; $('sRole').addEventListener('change', syncRole); syncRole();
  }
  function adminDialog(a) {
    const isNew = !a; a = a || { id: 'a' + uid(), name: '', role: 'operator', email: '', phone: '', active: true };
    openDialog(isNew ? 'ახალი ადმინისტრატორი' : 'ადმინისტრატორის რედაქტირება', `
      <div class="f"><label for="aName">სახელი, გვარი</label><input type="text" id="aName" value="${esc(a.name)}" required></div>
      <div class="f"><label for="aRole">როლი</label><select id="aRole">${Object.entries(ADMIN_ROLES).map(([k, v]) => `<option value="${k}" ${k === a.role ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="fgrid" style="padding:0"><div class="f"><label for="aEmail">ელ.ფოსტა</label><input type="email" id="aEmail" value="${esc(a.email)}" required></div><div class="f"><label for="aPhone">მობილური</label><input type="tel" id="aPhone" value="${esc(a.phone)}" required></div></div>`, () => {
      const name = $('aName').value.trim(), email = $('aEmail').value.trim(), phone = $('aPhone').value.trim(); if (!name) { $('aName').focus(); return false; } if (!email) { $('aEmail').focus(); return false; } if (!phone) { $('aPhone').focus(); return false; }
      const rec = { ...a, name, email, phone, role: $('aRole').value, active: a.active !== false };
      DB.admins = isNew ? [...DB.admins, rec] : DB.admins.map(x => x.id === a.id ? rec : x); if (admin && admin.id === rec.id) enter(rec); toast('შენახულია'); render();
    });
  }

  // ---------- დიალოგი და toast ----------
  let onOk = null;
  function openDialog(title, body, ok, okLabel = 'შენახვა', okClass = 'btn-green') {
    $('dlgOk').hidden = false; $('dlg').classList.remove('wide', 'view');
    $('dlgTitle').textContent = title; $('dlgBody').innerHTML = body; onOk = ok;
    $('dlgOk').textContent = okLabel; $('dlgOk').className = 'btn ' + okClass;
    const d = $('dlg'); if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    const f = d.querySelector('input:not([type=checkbox]):not([type=radio]):not([disabled]), select:not([disabled])'); if (f) f.focus();
  }
  function viewDialog(title, body) { openDialog(title, body, null); $('dlgOk').hidden = true; $('dlg').classList.add('wide'); }
  function closeDialog() { const d = $('dlg'); if (d.open) d.close(); onOk = null; }
  function confirmDialog(title, text, ok) { openDialog(title, `<p style="margin:0;color:var(--muted)">${esc(text)}</p>`, ok, 'წაშლა', 'btn-red'); }
  $('dlgForm').addEventListener('submit', e => { e.preventDefault(); if (onOk && onOk() === false) return; closeDialog(); });
  $('dlgX').addEventListener('click', closeDialog); $('dlgCancel').addEventListener('click', closeDialog);
  $('dlg').addEventListener('cancel', e => { e.preventDefault(); closeDialog(); });
  let toastT; function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

  // მენიუს შეკუმშვა/გაშლა — მდგომარეობა ინახება
  const sbSync = () => { const c = $('app').classList.contains('sbc'); $('sbTg').title = $('sbTg').ariaLabel = c ? 'მენიუს გაშლა' : 'მენიუს შეკუმშვა'; };
  if (store.get('adminSb') === 'c') $('app').classList.add('sbc');
  $('sbTg').addEventListener('click', () => { $('app').classList.toggle('sbc'); store.set('adminSb', $('app').classList.contains('sbc') ? 'c' : 'o'); sbSync(); });
  sbSync();
  // თავის სიგანე = სხეულის ხილული სიგანე: სქროლბარის სიგანე თავს მარჯვნივ padding-ად ემატება (სქროლის გარეშე 0 → ხაზები ბოლომდე)
  const syncHeads = () => document.querySelectorAll('.panel > .tbl').forEach(t => { const w = t.previousElementSibling; if (w && w.classList.contains('thw')) w.style.paddingRight = (t.offsetWidth - t.clientWidth) + 'px'; });
  new MutationObserver(syncHeads).observe($('main'), { childList: true, subtree: true }); new ResizeObserver(syncHeads).observe($('main')); window.addEventListener('resize', syncHeads);
  // ვიწროზე ჰორიზონტალური სქროლი: თავი სხეულს მიჰყვება
  document.addEventListener('scroll', e => { const t = e.target; if (t && t.classList && t.classList.contains('tbl')) { const w = t.previousElementSibling; if (w && w.classList.contains('thw')) w.scrollLeft = t.scrollLeft; } }, true);
  // სხვა ზედაპირების ცვლილებები (იგივე origin) — თავისით განახლდება
  window.addEventListener('storage', e => { if (admin && e.key && (e.key === 'apps' || e.key === 'users' || e.key.startsWith('partner'))) render(); });
  // ავტომატური შესვლა, თუ სესია შენახულია და ანგარიში აქტიურია
  { const id = store.get('adminSession'); const u = id && DB.admins.find(a => a.id === id); if (u && u.active) enter(u); }
</script>
</body>
</html>
