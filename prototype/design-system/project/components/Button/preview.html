<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap"><style>body{margin:0;padding:16px;background:var(--bg);color:var(--fg-body);font-family:var(--font-sans);font-size:14px;line-height:1.6}*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style><style>.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;border-radius:var(--radius-sm);font:inherit;font-weight:600;font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap}.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}.g{background:var(--green);color:var(--on-accent)}.g:hover{background:var(--green-dark)}.o{background:var(--orange);color:var(--on-accent)}.gh{background:transparent;color:var(--fg);border-color:var(--line)}.gh:hover{background:var(--bg-soft)}.r{background:transparent;color:var(--red);border-color:var(--red)}.r:hover{background:var(--red-soft)}.btn:disabled{opacity:.5;cursor:not-allowed}</style>
