# Local infrastructure for development: database and queue/cache.
# Files (organisation logos) are stored on disk in ./storage until hosting is decided.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
      POSTGRES_DB: loans
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
